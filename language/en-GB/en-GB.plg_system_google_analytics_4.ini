; Google Analytics 4 language file
PLG_SYSTEM_GOOGLE_ANALYTICS_4="Google Analytics 4"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_XML_DESCRIPTION="Installs the Google Analytics 4 (gtag.js) tracking snippet on your Joomla 4.4, 5.x, or 6.x website, with Consent Mode v2 defaults."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_MEASUREMENT_ID_LABEL="Measurement ID"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_MEASUREMENT_ID_DESC="Your Google Analytics 4 Measurement ID, e.g. 'G-XXXXXXXXXX'."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_ANONYMIZE_IP_LABEL="Anonymize IP"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_ANONYMIZE_IP_DESC="Truncate visitor IP addresses before they are sent to Google."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_CONSENT_FIELDSET_LABEL="Consent Mode v2"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_CONSENT_NOTE_LABEL="Note"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_CONSENT_NOTE_DESC="These are DEFAULT consent states sent before any user choice is known, as required by Google's Consent Mode v2 for EEA/UK/CH traffic. If you run a cookie-consent tool, configure it to push a 'consent' 'update' event to the dataLayer once the visitor responds. This plugin does not manage consent banners itself."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_ANALYTICS_STORAGE_LABEL="Default: Analytics storage"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_ANALYTICS_STORAGE_DESC="Default consent state for analytics cookies before the visitor responds to your consent banner."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_STORAGE_LABEL="Default: Ad storage"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_STORAGE_DESC="Default consent state for advertising cookies before the visitor responds to your consent banner."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_USER_DATA_LABEL="Default: Ad user data"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_USER_DATA_DESC="Default consent state for sending user data to Google for advertising purposes."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_PERSONALIZATION_LABEL="Default: Ad personalization"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_DEFAULT_AD_PERSONALIZATION_DESC="Default consent state for personalized advertising."
PLG_SYSTEM_GOOGLE_ANALYTICS_4_CONSENT_DENIED="Denied"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_CONSENT_GRANTED="Granted"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_WAIT_FOR_UPDATE_LABEL="Wait for update (ms)"
PLG_SYSTEM_GOOGLE_ANALYTICS_4_WAIT_FOR_UPDATE_DESC="Milliseconds Google tags will wait for a consent update signal before proceeding with default (denied) behaviour. 500 is Google's recommended default."
